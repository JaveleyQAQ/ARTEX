services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.phase1}
      POSTGRES_DB: ${POSTGRES_DB:-artex_phase1}
    volumes:
      - phase1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex_phase1}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  artex:
    image: ${ARTEX_IMAGE:-ghcr.io/javeleyqaq/artex}:${ARTEX_TAG:-phase1-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex_phase1}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "18787:8787"
      - "127.0.0.1:18788:8788"
    volumes:
      - ./data-phase1:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  phase1_pgdata:
    name: artex_phase1_pgdata
